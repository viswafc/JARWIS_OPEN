<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#071b2c" />
      <stop offset="60%" stop-color="#020912" />
      <stop offset="100%" stop-color="#010408" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGlow)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 1140 30 L 1170 30 L 1170 60" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 30 340 L 30 370 L 60 370" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
  <path d="M 1140 370 L 1170 370 L 1170 340" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />

  <!-- Top and Bottom Tech Lines -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#cyanLine)" stroke-width="1.5" />
  <line x1="100" y1="370" x2="1100" y2="370" stroke="url(#cyanLine)" stroke-width="1.5" />

  <!-- Arc Reactor Left Emblem (Center-Left: cx=220, cy=200) -->
  <g transform="translate(200, 200)">
    <!-- Outer Orbit Ring -->
    <circle r="120" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6" />
    <circle r="105" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 4 4 4" />
    
    <!-- Outer segmented ticks -->
    <circle r="92" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="2 10" />

    <!-- Core Rings with Glow -->
    <circle r="76" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" filter="url(#cyanGlow)" />
    <circle r="60" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-opacity="0.9" filter="url(#cyanGlow)" />
    <circle r="44" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" filter="url(#intenseGlow)" />

    <!-- Reactor Triangle -->
    <polygon points="0,-48 42,25 -42,25" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.8" filter="url(#cyanGlow)" />
    <polygon points="0,-36 31,18 -31,18" fill="#00e5ff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1" />

    <!-- Center Light Core -->
    <circle r="14" fill="#ffffff" filter="url(#intenseGlow)" />
    <circle r="7" fill="#00e5ff" />

    <!-- Radiation ticks / Crosshairs -->
    <line x1="-135" y1="0" x2="-115" y2="0" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" />
    <line x1="115" y1="0" x2="135" y2="0" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" />
    <line x1="0" y1="-135" x2="0" y2="-115" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" />
    <line x1="0" y1="115" x2="0" y2="135" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Typography & Headers (x=380) -->
  <g transform="translate(380, 0)">
    <!-- Sub-header Tag -->
    <rect x="0" y="85" width="230" height="26" rx="4" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4" />
    <text x="14" y="102" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#00e5ff" letter-spacing="3">AUTONOMOUS SYSTEM</text>
    <text x="250" y="102" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4a7a96" letter-spacing="1.5">VER. 1.0.0 // OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="185" font-family="'Chakra Petch', 'Segoe UI', -apple-system, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="14" filter="url(#cyanGlow)">J.A.R.V.I.S.</text>

    <!-- Subtitle -->
    <text x="4" y="228" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="400" fill="#8edaff" letter-spacing="2.5">
      HOLOGRAPHIC AI ASSISTANT · LOCAL NEURAL VOICE · 3D ARC REACTOR
    </text>

    <!-- Features / Badges Pills in SVG -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: WebGPU Kokoro -->
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#051726" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="16" r="4" fill="#00e5ff" />
      <text x="28" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cceeff" font-weight="500">100% Local Neural TTS</text>

      <!-- Pill 2: Three.js GLSL -->
      <rect x="195" y="0" width="165" height="32" rx="6" fill="#051726" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="211" cy="16" r="4" fill="#00e5ff" />
      <text x="223" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cceeff" font-weight="500">Three.js Arc Reactor</text>

      <!-- Pill 3: MediaPipe Vision -->
      <rect x="375" y="0" width="170" height="32" rx="6" fill="#051726" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="391" cy="16" r="4" fill="#00e5ff" />
      <text x="403" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cceeff" font-weight="500">MediaPipe Gestures</text>

      <!-- Pill 4: Zero Cloud Keys -->
      <rect x="560" y="0" width="150" height="32" rx="6" fill="#051726" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="576" cy="16" r="4" fill="#00e5ff" />
      <text x="588" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cceeff" font-weight="500">Zero Cloud Keys</text>
    </g>

    <!-- Author Tag -->
    <text x="4" y="338" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5888a6" letter-spacing="1">
      CREATED &amp; MAINTAINED BY <tspan fill="#00e5ff" font-weight="600">VISWA AG</tspan>
    </text>
  </g>

  <!-- Right Audio Frequency Bars -->
  <g transform="translate(1120, 200)">
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.7" />
    <line x1="-8" y1="-35" x2="-8" y2="35" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.5" />
    <line x1="-16" y1="-20" x2="-16" y2="20" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3" />
    <line x1="-24" y1="-45" x2="-24" y2="45" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />
    <line x1="-32" y1="-15" x2="-32" y2="15" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.2" />
  </g>
</svg>
